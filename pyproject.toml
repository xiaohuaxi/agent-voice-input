[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-voice-input"
version = "0.18.2"
description = "Context-aware voice input for CLI coding agents and desktop apps (two-stage STT + refiner or single-hop multimodal)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = [
    "voice-input",
    "dictation",
    "asr",
    "speech-to-text",
    "cli-agent",
    "codex",
    "claude-code",
    "antigravity",
    "agy",
    "tmux",
    "wsl2",
    "macos",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[[project.authors]]
name = "xiaohuaxi"

[project.urls]
Homepage = "https://github.com/xiaohuaxi/agent-voice-input"
Documentation = "https://github.com/xiaohuaxi/agent-voice-input#readme"
Repository = "https://github.com/xiaohuaxi/agent-voice-input"
Changelog = "https://github.com/xiaohuaxi/agent-voice-input/blob/main/CHANGELOG.md"
Issues = "https://github.com/xiaohuaxi/agent-voice-input/issues"

[project.scripts]
agent-voice-input = "agent_voice_input._entry:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_voice_input*"]

[tool.setuptools.package-data]
agent_voice_input = ["win_shim.ps1", "win_shim/*.cs", "mac_shim/*.swift"]
