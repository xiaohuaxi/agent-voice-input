name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Run tests, coverage gate, build & verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release tag, version sync, CHANGELOG & source ASCII
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python scripts/check_package.py --skip-dist --check-release-tag "$GITHUB_REF_NAME"
          else
            python scripts/check_package.py --skip-dist
          fi

      - name: Install ffmpeg, tmux, and openssh-server for integration tests
        run: |
          pkgs=""
          command -v ffmpeg >/dev/null 2>&1 || pkgs="$pkgs ffmpeg"
          command -v tmux >/dev/null 2>&1 || pkgs="$pkgs tmux"
          if ! command -v sshd >/dev/null 2>&1 && [ ! -x /usr/sbin/sshd ]; then
            pkgs="$pkgs openssh-server"
          fi
          if [ -n "$pkgs" ]; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends $pkgs
          fi

      - name: Install build, coverage, and twine tooling
        run: python -m pip install --upgrade pip coverage build twine

      - name: Run full offline unit tests (strict ResourceWarning, no silent skips)
        env:
          AGENT_VOICE_INPUT_CI_NO_SKIP: "1"
        run: PYTHONPATH=src python -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Run tiered statement & pure-branch coverage gate
        env:
          AGENT_VOICE_INPUT_CI_NO_SKIP: "1"
        run: python scripts/check_coverage.py --require-branch -v

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify packaged wheel, sdist contents, and PyPI metadata
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python scripts/check_package.py --check-release-tag "$GITHUB_REF_NAME"
          else
            python scripts/check_package.py
          fi
          python -m twine check dist/*

      - name: Clean venv wheel install smoke test
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d "${RUNNER_TEMP}/avi-publish-wheel-smoke-XXXXXX")"
          trap 'rm -rf "$SMOKE_DIR"' EXIT
          python -m venv "$SMOKE_DIR/venv"
          VENV_PY="$SMOKE_DIR/venv/bin/python"
          VENV_CLI="$SMOKE_DIR/venv/bin/agent-voice-input"
          (
            cd "$SMOKE_DIR"
            unset PYTHONPATH
            "$VENV_PY" -m pip install --no-deps "$GITHUB_WORKSPACE"/dist/*.whl

            export HOME="$SMOKE_DIR/home"
            export AGENT_VOICE_INPUT_HOME="$SMOKE_DIR/avi_home"
            export XDG_CACHE_HOME="$SMOKE_DIR/cache"
            export XDG_RUNTIME_DIR="$SMOKE_DIR/run"
            mkdir -p "$HOME" "$XDG_CACHE_HOME" "$XDG_RUNTIME_DIR"
            chmod 700 "$XDG_RUNTIME_DIR"

            "$VENV_CLI" --help >/dev/null
            VER_OUT="$("$VENV_CLI" --version)"
            echo "Installed CLI version: $VER_OUT"
            "$VENV_PY" - "$SMOKE_DIR/venv" "$VER_OUT" <<'PY'
          import importlib, pathlib, sys

          venv_root = pathlib.Path(sys.argv[1]).resolve()
          ver_out = sys.argv[2]

          for mod_name in (
              "agent_voice_input",
              "agent_voice_input.cli",
              "agent_voice_input.config",
              "agent_voice_input.daemon",
              "agent_voice_input.asr_providers",
              "agent_voice_input.refiner",
              "agent_voice_input.platform_macos",
              "agent_voice_input.platform_wsl",
              "agent_voice_input.remote_ssh",
          ):
              mod = importlib.import_module(mod_name)
              mod_path = pathlib.Path(mod.__file__).resolve()
              assert venv_root in mod_path.parents, f"{mod_name} not loaded from venv: {mod_path}"

          import agent_voice_input
          assert agent_voice_input.__version__ in ver_out, f"version {agent_voice_input.__version__!r} not in {ver_out!r}"

          pkg_dir = pathlib.Path(agent_voice_input.__file__).resolve().parent
          win_ps1 = pkg_dir / "win_shim.ps1"
          win_cs = sorted((pkg_dir / "win_shim").glob("*.cs"))
          mac_swift = sorted((pkg_dir / "mac_shim").glob("*.swift"))
          assert win_ps1.is_file(), f"missing {win_ps1}"
          assert win_cs, f"missing win_shim/*.cs under {pkg_dir}"
          assert mac_swift, f"missing mac_shim/*.swift under {pkg_dir}"
          print(f"Clean wheel smoke passed: {len(win_cs)} C# files, {len(mac_swift)} Swift files")
          PY
          )

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  macos-shim-check:
    name: macOS shim compile & self-check (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tmux and ffmpeg if missing (macOS)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          pkgs=""
          command -v tmux >/dev/null 2>&1 || pkgs="$pkgs tmux"
          command -v ffmpeg >/dev/null 2>&1 || pkgs="$pkgs ffmpeg"
          if [ -n "$pkgs" ]; then
            brew install $pkgs
          fi

      - name: Compile mac_shim, run --self-check, and run macOS platform verification
        env:
          AGENT_VOICE_INPUT_CI_NO_SKIP: "1"
        run: |
          set -euo pipefail
          ISO_DIR="$(mktemp -d "${RUNNER_TEMP}/avi-mac-shim-XXXXXX")"
          trap 'rm -rf "$ISO_DIR"' EXIT
          mkdir -p "$ISO_DIR/cache" "$ISO_DIR/run"
          chmod 700 "$ISO_DIR/run"
          XDG_CACHE_HOME="$ISO_DIR/cache" XDG_RUNTIME_DIR="$ISO_DIR/run" PYTHONPATH=src python - <<'PY'
          import os
          from agent_voice_input.platform_macos import compile_mac_shim, run_mac_shim_self_check

          iso_env = dict(os.environ)
          bin_path, err = compile_mac_shim(env=iso_env)
          assert not err and bin_path is not None and bin_path.is_file(), f"mac_shim compile failed: {err}"
          ok, payload, sc_err = run_mac_shim_self_check(bin_path, iso_env)
          assert ok and payload.get("ok") is True, f"mac_shim --self-check failed: {sc_err} {payload}"
          print(f"mac_shim --self-check passed: {payload}")
          PY
          PYTHONPATH=src python -W error::ResourceWarning -m unittest tests/test_macos_platform.py -v

  win-shim-check:
    name: Windows shim ASCII & self-check (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify win_shim 7-bit ASCII and run win_shim.ps1 -Mode self-check
        shell: powershell
        run: |
          python scripts/check_package.py --skip-dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $shimPath = (Resolve-Path "src\agent_voice_input\win_shim.ps1").Path
          $isoAppData = Join-Path $env:RUNNER_TEMP ("avi-publish-win-shim-" + [Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path $isoAppData | Out-Null
          $prevLocalAppData = $env:LOCALAPPDATA
          try {
            $env:LOCALAPPDATA = $isoAppData
            $out1 = & powershell.exe -NoProfile -NonInteractive -Sta -ExecutionPolicy Bypass -File $shimPath -Mode self-check -RealClipboard
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "Cold run: $out1"
            $p1 = ($out1 | Select-Object -Last 1) | ConvertFrom-Json
            if (-not $p1.ok -or $p1.mode -ne "self-check" -or -not $p1.real_clipboard_ok) {
              throw "Unexpected cold win_shim self-check output: $out1"
            }
            $out2 = & powershell.exe -NoProfile -NonInteractive -Sta -ExecutionPolicy Bypass -File $shimPath -Mode self-check -RealClipboard
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "Warm run: $out2"
            $p2 = ($out2 | Select-Object -Last 1) | ConvertFrom-Json
            if (-not $p2.ok -or $p2.mode -ne "self-check" -or -not $p2.cache_hit -or -not $p2.real_clipboard_ok) {
              throw "Unexpected warm win_shim self-check output: $out2"
            }
          } finally {
            $env:LOCALAPPDATA = $prevLocalAppData
            Remove-Item -Recurse -Force -Path $isoAppData -ErrorAction SilentlyContinue
          }

  publish:
    name: Publish to PyPI via Trusted Publisher OIDC
    needs: [test-and-build, macos-shim-check, win-shim-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/p/agent-voice-input
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release from CHANGELOG
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract release notes from CHANGELOG and publish GitHub Release
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          NOTES_FILE="${RUNNER_TEMP}/release_notes.md"
          rm -f "$NOTES_FILE"
          python scripts/check_package.py --skip-dist --check-release-tag "$TAG" --write-release-notes "$NOTES_FILE"
          test -s "$NOTES_FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE"
          fi
