name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Run unit tests and build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and tmux for integration tests
        run: |
          pkgs=""
          command -v ffmpeg >/dev/null 2>&1 || pkgs="$pkgs ffmpeg"
          command -v tmux >/dev/null 2>&1 || pkgs="$pkgs tmux"
          if [ -n "$pkgs" ]; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends $pkgs
          fi

      - name: Run unit tests
        run: PYTHONPATH=src python -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify packaged wheel and sdist contents
        run: |
          python - <<'PY'
          import glob, pathlib, tarfile, zipfile

          pkg_root = pathlib.Path("src/agent_voice_input")
          pkg_files = sorted(
              p.name
              for p in pkg_root.iterdir()
              if p.is_file() and p.suffix in (".py", ".ps1")
          )
          mac_shim_files = sorted(
              p.relative_to(pkg_root).as_posix()
              for p in (pkg_root / "mac_shim").glob("*.swift")
              if p.is_file()
          )
          assert pkg_files, "no package files discovered"
          assert mac_shim_files, "no mac_shim/*.swift files discovered"
          expected_wheel = {
              "agent_voice_input/__init__.py",
              "agent_voice_input/cli.py",
              "agent_voice_input/daemon.py",
              "agent_voice_input/prompts.py",
              "agent_voice_input/app_scope.py",
              "agent_voice_input/http_transport.py",
              "agent_voice_input/llm_common.py",
              "agent_voice_input/platform_common.py",
              "agent_voice_input/workspace_ctx.py",
              "agent_voice_input/_remote_probe.py",
              "agent_voice_input/remote_ssh.py",
              "agent_voice_input/win_shim.ps1",
              "agent_voice_input/mac_shim/BridgeMain.swift",
              *(f"agent_voice_input/{name}" for name in pkg_files),
              *(f"agent_voice_input/{rel}" for rel in mac_shim_files),
          }

          whls = glob.glob("dist/*.whl")
          assert len(whls) == 1, f"expected 1 wheel, got {whls}"
          with zipfile.ZipFile(whls[0]) as zf:
              names = set(zf.namelist())
              assert not any(
                  "/.agents/" in f"/{n}" or "/.claude/" in f"/{n}" for n in names
              ), f"unexpected .agents/.claude in wheel: {sorted(names)}"
              for req in sorted(expected_wheel):
                  assert req in names, f"missing {req} in wheel"
              assert any("LICENSE" in n for n in names), f"missing LICENSE in wheel: {sorted(names)}"
              eps = [n for n in names if n.endswith("entry_points.txt")]
              assert eps and "agent-voice-input = agent_voice_input.cli:main" in zf.read(eps[0]).decode("utf-8")

          integ_rels = sorted(
              "/" + p.as_posix() for p in pathlib.Path("integrations").rglob("*") if p.is_file()
          )
          doc_rels = sorted(
              "/" + p.as_posix() for p in pathlib.Path("docs").rglob("*.md") if p.is_file()
          )
          expected_sdist_suffixes = {
              "/LICENSE",
              "/AGENTS.md",
              "/CHANGELOG.md",
              "/ROADMAP.md",
              "/README.md",
              "/README.zh-CN.md",
              "/config.example.toml",
              "/config.example.env",
              "/docs/context-routing.md",
              "/scripts/check_coverage.py",
              "/integrations/remote/remote-title-hook.sh",
              "/.github/workflows/ci.yml",
              "/.github/workflows/publish.yml",
              "/src/agent_voice_input/prompts.py",
              "/src/agent_voice_input/app_scope.py",
              "/src/agent_voice_input/http_transport.py",
              "/src/agent_voice_input/llm_common.py",
              "/src/agent_voice_input/platform_common.py",
              "/src/agent_voice_input/workspace_ctx.py",
              "/src/agent_voice_input/_remote_probe.py",
              "/src/agent_voice_input/remote_ssh.py",
              "/src/agent_voice_input/win_shim.ps1",
              "/src/agent_voice_input/mac_shim/BridgeMain.swift",
              *(f"/src/agent_voice_input/{name}" for name in pkg_files),
              *(f"/src/agent_voice_input/{rel}" for rel in mac_shim_files),
              *integ_rels,
              *doc_rels,
          }

          sdists = glob.glob("dist/*.tar.gz")
          assert len(sdists) == 1, f"expected 1 sdist, got {sdists}"
          with tarfile.open(sdists[0], "r:gz") as tf:
              snames = set(tf.getnames())
              rel_snames = {"/" + n.split("/", 1)[1] for n in snames if "/" in n}
              assert not any(
                  n == "/.agents" or n.startswith("/.agents/") or n == "/.claude" or n.startswith("/.claude/")
                  for n in rel_snames
              ), f"unexpected .agents/.claude in sdist: {sorted(rel_snames)}"
              for suffix in sorted(expected_sdist_suffixes):
                  assert suffix in rel_snames, f"missing exact path {suffix} in sdist"
          PY

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI via Trusted Publisher OIDC
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/p/agent-voice-input
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release from CHANGELOG
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract release notes and publish GitHub Release
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          NOTES_FILE="/tmp/release_notes.md"
          rm -f "$NOTES_FILE"
          python3 - "$VERSION" "$NOTES_FILE" <<'PY'
          import pathlib, re, sys
          ver, out = re.escape(sys.argv[1]), pathlib.Path(sys.argv[2])
          p = pathlib.Path("CHANGELOG.md")
          if p.is_file():
              text = p.read_text(encoding="utf-8")
              m = re.search(
                  rf"^## (?:\[v?{ver}\]|v?{ver})(?=[ \t\-—–]|$)[^\n]*\n+(.*?)(?=^## \[|^\[[^\]\n]+\]:\s|\Z)",
                  text,
                  re.M | re.S,
              )
              if m and m.group(1).strip():
                  out.write_text(m.group(1).strip() + "\n", encoding="utf-8")
          PY
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ -s "$NOTES_FILE" ]; then
              gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES_FILE"
            fi
          else
            if [ -s "$NOTES_FILE" ]; then
              gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE"
            else
              gh release create "$TAG" --title "$TAG" --generate-notes
            fi
          fi
