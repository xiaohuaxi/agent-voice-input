# agent-voice-input example configuration
# Default location: ~/.config/agent-voice-input/config.toml (also falls back to ~/.config/voice-input/config.toml)
# Priority: CLI flags > config.toml > built-in defaults
# Specify a custom config file via --config / AGENT_VOICE_INPUT_CONFIG

[hotkey]
# Global hotkey:
# - Windows/WSL2: RControl (default Right Ctrl, 0xA3) | RAlt | RShift | CapsLock | F1..F24 | 0xNN
# - macOS: RControl (default Right Ctrl, 0x3E / NX_DEVICERCTLKEYMASK) | LControl | ROption/RAlt | RCommand | Fn | F1..F20 | 0xNN
key = "RControl"
# Trigger mode:
# - "tap_toggle": isolated tap toggles recording start/stop (chords such as RControl+C pass through untouched)
# - "ptt": push-to-talk (hold to speak, release to transcribe; pressing another key cancels)
trigger_mode = "tap_toggle"
# tap_max_ms = 1200
# debounce_ms = 180
# Start new hotkey recordings only when an allowed terminal window is focused (set false to allow triggering in any app;
# stopping or canceling an active recording is never blocked even if focus moved away)
only_in_terminals = true

[ui]
# Desktop HUD pill language: "auto" (follows Windows UI language on WSL2 or desktop/POSIX locale on macOS/Linux; falls back to "en") | "zh" | "en"
language = "auto"
# Desktop HUD pill vertical position: "bottom" (default, above Dock/taskbar) | "top"
position = "bottom"

[audio]
# Silence gate & RMS loudness normalization (pure stdlib; blocks accidental empty triggers before hitting cloud APIs)
# floor_dbfs = -50.0
# target_dbfs = -20.0
# max_gain_db = 40.0
# min_duration_sec = 0.3
# min_voiced_sec = 0.1
# Maximum single recording duration in seconds (default 600s = 10 minutes; HUD shows countdown in the final 15s and auto-finishes transcription; set 0 to disable)
# max_duration_sec = 600.0
# WSL2 capture source: "auto" (defaults to resident win_shim Windows WASAPI 16 kHz capture, avoiding WSLg RDPSource zero-packet deadlocks) | "wasapi" | "winmm" | "pulse"
wsl_source = "auto"
# macOS AVFoundation audio input device: "default" (system default mic) | device index e.g. "0" | device name
macos_device = "default"
# Start/stop audio cue is disabled by default to avoid 1-2s RDP audio wake-up lag; enable locally if desired
beep = false
# Tail drain seconds after stopping recording (auto-adapts by platform when unset: 0.65s on WSL2/RDP, 0.20s on macOS)
# tail_drain_sec = 0.65

[asr]
# Stage 1 speech-to-text provider:
# "auto" | "dashscope" | "doubao" | "openrouter" | "gemini" | "openai" | "groq" | "siliconflow" | "openai-compatible"
# When "auto", selects the first configured credential in priority order:
#   dashscope -> doubao -> openrouter -> gemini -> openai -> groq -> siliconflow
provider = "auto"
# Upstream model ID (kept verbatim; leave empty "" to use the provider's built-in default):
# - dashscope         -> "qwen3-asr-flash" (also supports "fun-asr-realtime" / "qwen-audio-turbo-latest")
# - doubao            -> "bigmodel"
# - openrouter        -> "qwen/qwen3-asr-1.7b" (dedicated STT) or e.g. "google/gemini-2.5-flash" / "openai/gpt-audio-mini" (single-hop chat audio)
# - gemini            -> "gemini-2.5-flash" (native :generateContent single-hop audio + context refinement; skips Stage 2 by default)
# - openai            -> "gpt-4o-mini-transcribe"
# - groq              -> "whisper-large-v3-turbo"
# - siliconflow       -> "FunAudioLLM/SenseVoiceSmall"
# - openai-compatible -> "gpt-4o-mini-transcribe" (requires explicit base_url, e.g. local faster-whisper-server)
model = ""
# Wire protocol for OpenRouter / OpenAI-compatible channels:
# "auto" | "audio-transcriptions" (dedicated STT -> Stage 2) | "chat-completions" (multimodal single-hop audio + context; skips Stage 2 by default)
# Note: "auto" classifies known STT vs multimodal audio models automatically; for uncataloged models on "openrouter", set api explicitly.
api = "auto"
# Stage 1 thinking/reasoning budget:
# "auto" (suppresses default thinking latency on supported multimodal models) | "default" | "none" | "minimal" | "low" | "medium" | "high" | "xhigh" | "max"
effort = "auto"
# Doubao resource slot & mode: "auto" (auto-probes and caches available slot) or explicit e.g. "volc.seedasr.auc"
resource_id = "auto"
doubao_mode = "auto"
# Required when provider = "openai-compatible"; built-in providers resolve base_url automatically
base_url = ""
# Optional custom environment variable name holding the Stage 1 API key
api_key_env = ""
hotwords_file = "~/.config/agent-voice-input/hotwords.txt"
# timeout_sec = 60.0

[refiner]
# Stage 2 context-aware refinement provider:
# "codex" | "dashscope" | "volcengine" | "openrouter" | "gemini" | "openai" | "groq" | "siliconflow" | "openai-compatible" | "off"
# Built-in default models (used when model = "" or when provider is overridden via CLI without a new model):
# - codex             -> "gpt-6-luna" (resident codex app-server in-memory thread; never enables Fast mode)
# - dashscope         -> "qwen-turbo-latest"
# - volcengine        -> "doubao-seed-1-6-flash"
# - openrouter        -> "google/gemini-2.5-flash-lite"
# - gemini            -> "gemini-2.5-flash-lite"
# - openai            -> "gpt-4o-mini"
# - groq              -> "llama-3.3-70b-versatile"
# - siliconflow       -> "Qwen/Qwen2.5-7B-Instruct"
# - openai-compatible -> requires explicit base_url and model (loopback URLs require no API key)
# - off               -> disable Stage 2 refinement
provider = "codex"
# Leave empty "" to use the selected provider's built-in default model above
model = ""
# Stage 2 thinking/reasoning budget:
# "auto" | "default" | "none" | "minimal" | "low" | "medium" | "high" | "xhigh" | "max"
effort = "low"
# Required when provider = "openai-compatible" (e.g. "http://127.0.0.1:8000/v1"); built-in providers resolve base_url automatically
base_url = ""
api_key_env = ""
# max_turns_per_thread = 20
# timeout_sec = 90.0
# Set true to run Stage 2 refinement even when Stage 1 already performed single-hop multimodal refinement
force_on_single_hop = false

# -----------------------------------------------------------------------------
# Quick Recipes (replace the [asr] / [refiner] values above as needed)
# -----------------------------------------------------------------------------
# Recipe 1 — OpenRouter single key (two-stage dedicated STT + fast refiner, using built-in defaults):
#   [asr]
#   provider = "openrouter"
#   [refiner]
#   provider = "openrouter"
#
# Recipe 2 — OpenRouter single key (single-hop multimodal audio + context; skips Stage 2):
#   [asr]
#   provider = "openrouter"
#   model = "google/gemini-2.5-flash"
#   effort = "auto"
