# agent-voice-input example configuration
# Default location: ~/.agent-voice-input/config.toml (override app home via AGENT_VOICE_INPUT_HOME)
# Priority: CLI flags > config.toml > built-in defaults
# Custom path: --config / AGENT_VOICE_INPUT_CONFIG (credentials still load from <app_home>/.env)
#
# Layout:
#   - Common options are active (uncommented) at the top of each section with built-in defaults.
#   - Advanced tuning options are commented out under each section; uncomment only when needed.


# =============================================================================
# [hotkey] Trigger key, mode, scope & remote-desktop yielding
# =============================================================================
[hotkey]
# Global hotkey:
# - Without config.toml (or when `key` is omitted), runtime automatically defaults to "RCommand" on
#   MacBook built-in keyboards and "RControl" on desktop Macs & Windows/WSL2; an explicit `key` here
#   (or CLI `--hotkey`) strictly takes precedence.
# - Windows/WSL2: RControl (Right Ctrl, 0xA3) | RAlt | RShift | CapsLock | F1..F24 | 0xNN
# - macOS: RControl (Right Ctrl, 0x3E) | LControl | RCommand | ROption/RAlt | Fn | F1..F20 | 0xNN
#   (macOS pitfalls: "ROption" conflicts with Doubao IME; "Fn" conflicts with the macOS Globe key unless
#    System Settings -> Keyboard -> "Press 🌐 key to" is set to "Do Nothing"; "RShift" conflicts with Chinese IME toggle.)
key = "RControl"

# Trigger mode:
# - "tap_toggle": isolated short tap (<= tap_max_ms) toggles recording start/stop (or starts a back-to-back clip while refining);
#                 holding alone for hold_cancel_ms triggers layered cancel immediately (chords like RControl+C pass through untouched)
# - "ptt": push-to-talk (hold to speak, release to transcribe; pressing another key cancels)
trigger_mode = "tap_toggle"

# Scope for starting new recordings (stopping/canceling an active recording works from any window):
# - "all" (default): dictate anywhere (terminals bind to active CLI session; IDEs use workspace context; general apps use prose mode)
# - "coding": start only in terminals and code editors / IDEs
# - "terminals": start only in supported terminal emulators
scope = "all"

# Yield hotkey silently when a remote desktop / streaming / VM client window is focused
# (Windows excludes bare "msrdc" by default to protect Win11 WSLg; non-WSLg AVD/W365 users can add "msrdc" to ignore_apps)
yield_remote_desktop = true

# Extra process names or macOS bundle IDs (supports trailing "*" prefix match) where new triggers are ignored
ignore_apps = []

# --- Advanced tuning (uncomment to override) ---

# Maximum isolated tap duration in ms for "tap_toggle" (500ms..hold_cancel_ms is a silent hesitation deadzone)
# tap_max_ms = 500

# Hold-to-cancel threshold in ms for "tap_toggle" (fires while held with a 250ms preview hint; 0 disables)
# hold_cancel_ms = 800

# Debounce interval in ms between consecutive hotkey edges
# debounce_ms = 180


# =============================================================================
# [ui] Desktop HUD pill appearance
# =============================================================================
[ui]
# HUD pill language: "auto" (follows OS/POSIX locale; falls back to "en") | "zh" | "en"
# Also accepts standard BCP 47 language tags such as "zh-CN", "zh-TW", "en-US", "en-GB".
language = "auto"

# HUD pill vertical position: "bottom" (above Dock/taskbar) | "top"
position = "bottom"


# =============================================================================
# [archive] Opt-in local dictation history (both off by default)
# =============================================================================
[archive]
# Both archives live under ~/.agent-voice-input/ with 0700 dirs & 0600 files (ignored by default .gitignore)
# and share a 1:1 short utterance ID (`YYYYMMDD-HHMMSS-<4hex>`) with diag.jsonl (which never stores spoken text).

# Append 12-field JSONL records (draft + final text + metadata, never session context/hotwords/secrets)
# to ~/.agent-voice-input/transcripts/YYYY-MM.jsonl (unlimited)
save_transcripts = false

# Archive valid voiced clips as 16 kHz mono 64 kbps MP3 to ~/.agent-voice-input/audio/<id>.mp3
save_audio = false

# Rolling audio archive retention count (0 disables automatic pruning)
audio_max_count = 1000


# =============================================================================
# [asr] Stage 1 speech-to-text (or single-hop multimodal audio)
# =============================================================================
[asr]
# Stage 1 provider:
# "auto" | "dashscope" | "doubao" | "deepseek" | "openai" | "gemini" | "groq" | "openrouter" | "siliconflow" | "openai-compatible"
# Aliases accepted: "volcengine"/"volc" -> "doubao", "bailian" -> "dashscope"
# "auto" picks the first configured credential in order:
#   dashscope -> doubao -> deepseek -> openai -> gemini -> groq -> openrouter -> siliconflow
provider = "auto"

# Upstream model ID (leave "" for provider default; explicit values pass through verbatim):
# - dashscope         -> "qwen3-asr-flash" (STT; also supports single-hop "qwen3.8-omni-flash")
# - doubao            -> "bigmodel"
# - deepseek          -> "deepseek-asr" (official /v1/tools/asr; <=8 MiB / <=120s per chunk)
# - openai            -> "gpt-transcribe" (STT; or single-hop "gpt-audio-1.5" / "gpt-audio-mini")
# - gemini            -> "gemini-3.7-flash" (native :generateContent single-hop; skips Stage 2 by default)
# - groq              -> "whisper-large-v3-turbo"
# - openrouter        -> "microsoft/mai-transcribe-2" (STT with native keyterms, ~$0.10/hr)
# - siliconflow       -> "FunAudioLLM/SenseVoiceSmall"
# - openai-compatible -> "gpt-4o-mini-transcribe" (requires explicit base_url)
model = ""

# Wire protocol ("auto" | "audio-transcriptions" | "chat-completions"):
# - "auto" classifies known STT vs single-hop multimodal models (keep "auto" for doubao / gemini / deepseek).
# - For uncataloged models on "openrouter", set api explicitly.
api = "auto"

# Stage 1 thinking/reasoning budget (applies to single-hop multimodal audio models; ignored by dedicated STT):
# - "" (default): tool-recommended low-latency "none"
# - "default": omit thinking params and defer to upstream provider default
# - Explicit levels: "none" | "minimal" | "low" | "medium" | "high" | "xhigh" | "max"
effort = ""

# --- Advanced tuning (uncomment to override) ---

# Doubao Speech ASR resource slot & mode (auth uses DOUBAO_SPEECH_API_KEY, or legacy DOUBAO_ASR_APP_ID + DOUBAO_ASR_API_KEY):
# "auto" prefers sync flash ("volc.bigasr.auc_turbo") and caches fallback to 2.0 ("volc.seedasr.auc") / 1.0 ("volc.bigasr.auc").
# doubao_resource_id = "auto"
# doubao_mode = "auto"

# Custom endpoint URL (required when provider = "openai-compatible"; built-in providers resolve automatically)
# base_url = ""

# Custom environment variable name holding the Stage 1 API key
# api_key_env = ""

# Request timeout in seconds & same-provider transient retry attempts (0 disables retry)
# timeout_sec = 60.0
# max_retries = 2

# Personal hotwords live in ~/.agent-voice-input/hotwords/personal.txt (hot-reloaded).
# Stage 1 quotas: DashScope 250 terms / 2,800 chars, Doubao 50 terms / 1,000 chars,
# OpenAI keywords[] 50 terms, OpenRouter keyterms 50 terms, Whisper 35 terms / 353 chars.
# Stage 2 / single-hop selects up to 200 items / 3,000 chars (!pinned -> aliased -> file order).
# Manage via `agent-voice-input hotwords list|add|remove|path`.


# =============================================================================
# [refiner] Stage 2 context-aware refinement
# =============================================================================
[refiner]
# Stage 2 provider:
# "auto" | "codex" | "agy" | "deepseek" | "dashscope" | "volcengine" | "openrouter" | "gemini" | "openai" | "groq" | "siliconflow" | "openai-compatible" | "off"
# Aliases accepted: "doubao"/"volc"/"ark" -> "volcengine", "bailian" -> "dashscope"
# "auto" prefers confirmed local `codex` ChatGPT subscription login (zero extra API billing), then:
#   openrouter -> deepseek -> dashscope -> gemini -> volcengine -> openai -> groq -> siliconflow
# (falls back cleanly to "off" if no Stage 2 credentials exist; "agy" is explicit opt-in only).
# Built-in default models:
# - codex             -> "gpt-6-luna" (stateless HTTP /responses; auto-falls back if unavailable on account; never enables Fast mode)
# - agy               -> "gemini-3.8-flash" (explicit-only local `agy acp` zero-tool text refiner; default effort = "low")
# - deepseek          -> "deepseek-flash"
# - dashscope         -> "qwen3.8-flash"
# - volcengine        -> "doubao-seed-2-0-mini-260428"
# - openrouter        -> "google/gemini-3.8-flash"
# - gemini            -> "gemini-3.7-flash"
# - openai            -> "gpt-6-luna"
# - groq              -> "llama-3.3-70b-versatile"
# - siliconflow       -> "Qwen/Qwen2.5-7B-Instruct"
# - openai-compatible -> requires explicit base_url and model
provider = "auto"

# Leave "" to use the selected provider's built-in default model above
model = ""

# Wire protocol: "auto" ("responses" for codex & official openai, "agy-acp" for agy, "gemini" for gemini, "chat-completions" elsewhere) | "chat-completions" | "responses"
api = "auto"

# Stage 2 thinking/reasoning budget:
# - "" (default): "low" for codex / agy / openai / openrouter, "none" for all other providers
# - "default": omit thinking params and defer to upstream provider default
# - Explicit levels: "none" | "minimal" | "low" | "medium" | "high" | "xhigh" | "max"
effort = ""

# Optional user preferences appended safely after the built-in system prompt (applies to BOTH two-stage
# refinement and single-hop multimodal ASR; built-in dictation & safety rules remain intact).
# Accepts a list of short strings, a single string (""), or multiline '''...''' text (max 20 items, 2,000 chars total).
# Leave empty [] (or "") to keep the built-in prompt byte-for-byte unchanged.
# extra_instructions = [
#   "Output Traditional Chinese",
#   "Keep English technical terms unspaced from Chinese punctuation",
# ]
extra_instructions = []

# --- Advanced tuning (uncomment to override) ---

# Include workspace git status / core repo filenames in the final user block (preserves 50K prefix cache)
# include_git_status = true

# Max recent session dialogue characters extracted for context (0 disables dialogue history; 50K sealed blocks)
# context_max_chars = 200000

# Cold-start fallback when active coding session is empty/very short:
# "auto" (hotwords + <=25K frozen prior same-cwd session block) | "hotwords" | "off"
# cold_start_fallback = "auto"

# Custom endpoint URL (required when provider = "openai-compatible") & custom API key env var
# base_url = ""
# api_key_env = ""

# Request timeout in seconds & same-provider transient retry attempts (0 disables retry)
# timeout_sec = 90.0
# max_retries = 2

# Run Stage 2 refinement even when Stage 1 already performed single-hop multimodal refinement
# force_on_single_hop = false

# Applies to provider = "agy" only: max stateful thread turns before opening a fresh session
# (0 = no fixed turn cap; threads rotate naturally on 200K eviction or vocabulary_hints change)
# session_max_turns = 0


# =============================================================================
# [audio] Capture source, audio cue & pre-ASR acoustic processing
# =============================================================================
[audio]
# WSL2 capture source: "auto" (resident win_shim Windows WASAPI 16 kHz) | "wasapi" | "pulse"
wsl_source = "auto"

# macOS AVFoundation input device: "default" (system default mic) | device index e.g. "0" | device name
macos_device = "default"

# Start/stop audio cue (disabled by default to avoid 1-2s RDP audio wake-up lag)
beep = false

# --- Advanced tuning (uncomment to override) ---

# Pre-ASR long-pause & leading/trailing silence compression ("balanced" | "conservative" | "off")
# silence_trim = "balanced"

# Max single recording duration in seconds (HUD counts down in final 15s and auto-finishes; 0 disables)
# max_duration_sec = 600.0

# Tail drain seconds after stopping recording (auto-adapts when unset: 0.65s on WSL2/RDP, 0.20s on macOS)
# tail_drain_sec = 0.65

# Silence gate & RMS loudness normalization thresholds (pure stdlib)
# floor_dbfs = -50.0
# target_dbfs = -20.0
# max_gain_db = 40.0
# min_duration_sec = 0.3
# min_voiced_sec = 0.1


# =============================================================================
# [remote] Optional zero-install SSH remote Linux session context routing
# =============================================================================
[remote]
# Explicit host allowlist for `ssh ... -- <target> python3 -` (zero remote install, zero remote keys).
# Even when `hosts = []`, foreground SSH terminals & Remote-SSH IDEs automatically block local crosstalk.
hosts = []

# --- Advanced tuning (uncomment to override) ---

# Hard post-stop wait cap in ms (recording-start async prefetch hides SSH latency during speech)
# timeout_ms = 400

# Custom SSH binary (on WSL2 when SSH keys / 1Password Agent live on Windows, set `ssh_bin = "ssh.exe"`)
# ssh_bin = "ssh"

# Multi-alias host entry (when remote prompt/[@tag] hostname differs from ~/.ssh/config Host alias):
# [[remote.hosts]]
# name = "devbox"
# ssh_target = "my-cloud-gpu-01"
# aliases = ["gpu01", "ubuntu-prod"]
# ssh_bin = "ssh"
# timeout_ms = 800


# =============================================================================
# Quick Recipes (adjust [asr] / [refiner] above as needed)
# =============================================================================
# Recipe 1 — OpenRouter single key (two-stage STT + fast refiner using built-in defaults):
#   [asr]
#   provider = "openrouter"
#
#   [refiner]
#   provider = "openrouter"
#
# Recipe 2 — Single-hop multimodal audio + 50K cached session context (skips Stage 2):
#   [asr]
#   provider = "dashscope"              # Or provider = "gemini" (built-in default: "gemini-3.7-flash")
#   model = "qwen3.8-omni-flash"
#   # effort = ""                       # Recommended default ("none") already minimizes thinking latency
