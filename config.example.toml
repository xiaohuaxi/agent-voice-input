# agent-voice-input example configuration
# Default location: ~/.config/agent-voice-input/config.toml (also falls back to ~/.config/voice-input/config.toml)
# Priority: CLI flags > config.toml > built-in defaults
# Specify a custom config file via --config / AGENT_VOICE_INPUT_CONFIG

[hotkey]
# Global hotkey:
# - Windows/WSL2: RControl (default Right Ctrl, 0xA3) | RAlt | RShift | CapsLock | F1..F24 | 0xNN
# - macOS: RControl (default Right Ctrl, 0x3E / NX_DEVICERCTLKEYMASK) | LControl | ROption/RAlt | RCommand | Fn | F1..F20 | 0xNN
key = "RControl"
# Trigger mode:
# - "tap_toggle": isolated short tap (<= tap_max_ms) toggles recording start/stop (or starts a back-to-back recording while refining);
#                 holding the hotkey alone for hold_cancel_ms triggers layered cancel immediately without waiting for release (chords like RControl+C pass through untouched)
# - "ptt": push-to-talk (hold to speak, release to transcribe; pressing another key cancels)
trigger_mode = "tap_toggle"
# Maximum isolated tap duration in ms for "tap_toggle" (default 500ms; 500ms..hold_cancel_ms is a silent hesitation deadzone)
# tap_max_ms = 500
# Hold-to-cancel threshold in ms for "tap_toggle" (default 800ms, fires immediately while held with a 250ms preview hint; set 0 to disable)
# hold_cancel_ms = 800
# debounce_ms = 180
# Hotkey activation scope for starting new recordings (stopping/canceling an active recording works from any window):
# - "all" (default): dictate anywhere (terminals bind to active CLI session; IDEs use isolated coding mode; general apps use everyday prose mode)
# - "coding": start only in terminals and code editors / IDEs
# - "terminals": start only in allowed terminal emulators (legacy `only_in_terminals = true/false` remains supported)
scope = "all"
# Yield hotkey silently when a remote desktop / streaming / VM client window is focused so the remote host can handle it
# (Note: Windows excludes bare "msrdc" by default to protect Win11 WSLg Linux GUI apps; AVD/W365 users not using WSLg can add "msrdc" to ignore_apps)
yield_remote_desktop = true
# Extra process names or macOS bundle IDs (supports trailing "*" prefix match) where new hotkey recordings should be ignored:
ignore_apps = []

[ui]
# Desktop HUD pill language: "auto" (follows Windows UI language on WSL2 or desktop/POSIX locale on macOS/Linux; falls back to "en") | "zh" | "en"
language = "auto"
# Desktop HUD pill vertical position: "bottom" (default, above Dock/taskbar) | "top"
position = "bottom"

[audio]
# Silence gate & RMS loudness normalization (pure stdlib; blocks accidental empty triggers before hitting cloud APIs)
# floor_dbfs = -50.0
# target_dbfs = -20.0
# max_gain_db = 40.0
# min_duration_sec = 0.3
# min_voiced_sec = 0.1
# Maximum single recording duration in seconds (default 600s = 10 minutes; HUD shows countdown in the final 15s and auto-finishes transcription; set 0 to disable)
# max_duration_sec = 600.0
# WSL2 capture source: "auto" (defaults to resident win_shim Windows WASAPI 16 kHz capture, avoiding WSLg RDPSource zero-packet deadlocks) | "wasapi" | "winmm" | "pulse"
wsl_source = "auto"
# macOS AVFoundation audio input device: "default" (system default mic) | device index e.g. "0" | device name
macos_device = "default"
# Start/stop audio cue is disabled by default to avoid 1-2s RDP audio wake-up lag; enable locally if desired
beep = false
# Tail drain seconds after stopping recording (auto-adapts by platform when unset: 0.65s on WSL2/RDP, 0.20s on macOS)
# tail_drain_sec = 0.65
# Optional local MP3 ring archive of valid voiced recordings under ~/.cache/agent-voice-input/recordings/ (16 kHz mono 64 kbps, 0600 mode, off by default)
# save_recordings = false
# save_recordings_max_count = 300

[asr]
# Stage 1 speech-to-text provider:
# "auto" | "dashscope" | "doubao" | "openrouter" | "gemini" | "openai" | "groq" | "siliconflow" | "openai-compatible"
# Cross-stage aliases accepted: "volcengine"/"volc" -> "doubao", "bailian" -> "dashscope"
# When "auto", selects the first configured credential in priority order:
#   dashscope -> doubao -> openrouter -> gemini -> openai -> groq -> siliconflow
provider = "auto"
# Upstream model ID (kept verbatim; leave empty "" to use the provider's built-in default):
# - dashscope         -> "qwen3-asr-flash" (dedicated STT; also supports "fun-asr-realtime", "qwen-audio-turbo-latest", or single-hop "qwen3.8-omni-flash")
# - doubao            -> "bigmodel"
# - openrouter        -> "qwen/qwen3-asr-1.7b" (dedicated STT) or e.g. "google/gemini-3.5-flash-lite" / "qwen/qwen3.8-omni-flash" / "openai/gpt-audio-mini" (single-hop chat audio)
# - gemini            -> "gemini-3.5-flash-lite" (native :generateContent single-hop audio + context refinement; skips Stage 2 by default)
# - openai            -> "gpt-4o-mini-transcribe"
# - groq              -> "whisper-large-v3-turbo"
# - siliconflow       -> "FunAudioLLM/SenseVoiceSmall"
# - openai-compatible -> "gpt-4o-mini-transcribe" (requires explicit base_url, e.g. local faster-whisper-server)
model = ""
# Wire protocol for DashScope / OpenRouter / OpenAI-compatible channels:
# "auto" | "audio-transcriptions" (dedicated STT -> Stage 2) | "chat-completions" (multimodal single-hop audio + 50K cached session context; skips Stage 2 by default)
# Note: in coding-agent mode, single-hop audio models send up to refiner.context_max_chars of recent session dialogue to the selected ASR provider.
# "auto" classifies known STT vs multimodal audio models automatically; for uncataloged models on "openrouter", set api explicitly.
api = "auto"
# Stage 1 thinking/reasoning budget:
# "auto" (suppresses default thinking latency on supported multimodal models) | "default" | "none" | "minimal" | "low" | "medium" | "high" | "xhigh" | "max"
effort = "auto"
# Doubao Speech ASR auth, resource slot & mode:
# Auth uses single-header DOUBAO_SPEECH_API_KEY (X-Api-Key, no APP_ID needed; legacy DOUBAO_ASR_APP_ID + DOUBAO_ASR_API_KEY dual-header remains compatible when DOUBAO_SPEECH_API_KEY is unset).
# "auto" prefers low-latency sync flash ("volc.bigasr.auc_turbo") and falls back on first 403 to 2.0 standard ("volc.seedasr.auc") / 1.0 ("volc.bigasr.auc"), caching the granted slot in memory.
# Set resource_id explicitly (e.g. "volc.bigasr.auc_turbo" or "volc.seedasr.auc") to skip cold-start slot probing; doubao_mode = "submit" | "flash" restricts "auto" probing to that mode.
resource_id = "auto"
doubao_mode = "auto"
# Required when provider = "openai-compatible"; built-in providers resolve base_url automatically
base_url = ""
# Optional custom environment variable name holding the Stage 1 API key
api_key_env = ""
# Custom layered plain-text hotwords file (hot-reloaded on change, no daemon restart needed).
# Supports optional [global], [chat] (IM/AI chat), and [coding] (terminal/IDE/Agent) sections; flat files map to [global].
# Manage via `agent-voice-input hotwords list|add|remove` (manual terms always take top priority over dynamic/built-in words).
hotwords_file = "~/.config/agent-voice-input/hotwords.txt"
# timeout_sec = 60.0
# Extra retry attempts within the same provider on rate-limit / transient network errors (0 disables retry)
# max_retries = 2

[refiner]
# Stage 2 context-aware refinement provider:
# "auto" | "codex" | "deepseek" | "dashscope" | "volcengine" | "openrouter" | "gemini" | "openai" | "groq" | "siliconflow" | "openai-compatible" | "off"
# Cross-stage aliases accepted: "doubao"/"volc"/"ark" -> "volcengine", "bailian" -> "dashscope"
# When "auto" (default), prefers confirmed local `codex` ChatGPT subscription login (zero extra API billing), otherwise selects the first configured credential in order:
#   deepseek -> dashscope -> gemini -> openrouter -> volcengine -> openai -> groq -> siliconflow
# (then falls back to Codex keyring / API-key login if present, or cleanly to "off" if no Stage 2 credentials are set).
# Built-in default models (used when model = "" or when provider is overridden via CLI without a new model):
# - codex             -> "gpt-6-luna" (stateless Keep-Alive HTTP /responses reusing local codex login, with automatic public mini-model fallback when internal models are unavailable; never enables Fast mode)
# - deepseek          -> "deepseek-flash" (official https://api.deepseek.com/v1 with thinking disabled by default)
# - dashscope         -> "qwen3.8-flash"
# - volcengine        -> "doubao-seed-2-0-mini-260428"
# - openrouter        -> "google/gemini-3.5-flash-lite"
# - gemini            -> "gemini-3.5-flash-lite"
# - openai            -> "gpt-4o-mini"
# - groq              -> "llama-3.3-70b-versatile"
# - siliconflow       -> "Qwen/Qwen2.5-7B-Instruct"
# - openai-compatible -> requires explicit base_url and model (e.g. local loopback Ollama/vLLM without API key)
# - off               -> disable Stage 2 refinement
provider = "auto"
# Leave empty "" to use the selected provider's built-in default model above
model = ""
# Stage 2 wire protocol:
# "auto" ("responses" for codex, "gemini" for gemini, "chat-completions" for other providers) | "chat-completions" | "responses"
api = "auto"
# Stage 2 thinking/reasoning budget (leave empty "" to use the provider default: "low" for codex/openai, "auto" zero-thinking fast mode for other providers):
# "auto" | "default" | "none" | "minimal" | "low" | "medium" | "high" | "xhigh" | "max"
effort = ""
# Custom Stage 2 system prompt (leave empty "" to use the built-in adaptive agent/general voice-dictation editor prompts;
# setting a non-empty prompt overrides both modes).
# Supports TOML multiline literal strings '''...''' (no backslash escaping needed) or """...""";
# in agent mode, requests supply read-only <session_reference_log> context blocks (as developer messages on /responses,
# or leading user blocks on /chat/completions) followed by optional <workspace_git_status>, <asr_draft_to_clean>, and <task_reminder>:
# prompt = '''
# You are a stateless, non-conversational voice-dictation text editor, NOT a chat or coding assistant.
# Fix ASR homophones/typos using <session_reference_log> and <workspace_git_status>, resolve self-corrections,
# preserve every substantive point and language(s), and output ONLY the cleaned <asr_draft_to_clean>.
# '''
prompt = ""
# Include workspace git status / modified filenames (or clean-worktree core repo filenames) in the final user block (keeps 50K prefix cache intact)
include_git_status = true
# Maximum recent session dialogue characters extracted for Stage 2 context (0 disables dialogue history; ~1/4-window eviction)
context_max_chars = 200000
# Cold-start fallback when the active coding session is empty/very short (or a workspace has no active session):
# - "auto" (default): Stage 1 hotwords from recent same-cwd sessions + frozen <=25K prior same-cwd session block for Stage 2 / single-hop (naturally evicted once the new session fills context_max_chars)
# - "hotwords": Stage 1 technical hotwords from recent same-cwd sessions only (no prior dialogue prose)
# - "off": disable cold-start prior-session fallback
cold_start_fallback = "auto"
# Required when provider = "openai-compatible" (e.g. "http://127.0.0.1:8000/v1"); built-in providers resolve base_url automatically
base_url = ""
api_key_env = ""
# timeout_sec = 90.0
# Extra retry attempts within the same provider on rate-limit / transient network errors (0 disables retry)
# max_retries = 2
# Set true to run Stage 2 refinement even when Stage 1 already performed single-hop multimodal refinement
force_on_single_hop = false

[remote]
# Optional zero-install SSH remote Linux session context routing (no remote daemon, no remote pip install, no remote API keys).
# Only hosts explicitly listed here may be queried via `ssh ... -- <target> python3 -` (protects against untrusted OSC 2 terminal titles).
# Even when `hosts = []`, foreground SSH terminals and Remote-SSH IDEs automatically veto local background session crosstalk.
hosts = []
# Hard post-stop wait cap in milliseconds (recording-start async prefetch hides SSH handshake latency during speech)
timeout_ms = 400
# Optional SSH client binary (on WSL2 when keys/1Password live only on Windows, set `ssh_bin = "ssh.exe"`):
# ssh_bin = "ssh"
#
# Advanced multi-alias form (optional, when remote hostname in prompt/[@tag] differs from ~/.ssh/config Host alias):
# [[remote.hosts]]
# name = "devbox"
# ssh_target = "my-cloud-gpu-01"
# aliases = ["gpu01", "ubuntu-prod"]
# ssh_bin = "ssh"

# -----------------------------------------------------------------------------
# Quick Recipes (replace the [asr] / [refiner] values above as needed)
# -----------------------------------------------------------------------------
# Recipe 1 — OpenRouter single key (two-stage dedicated STT + fast refiner, using built-in defaults):
#   [asr]
#   provider = "openrouter"
#   [refiner]
#   provider = "openrouter"
#
# Recipe 2 — Single-hop multimodal audio + 50K cached session context (DashScope Qwen-Omni or OpenRouter Gemini; skips Stage 2):
#   [asr]
#   provider = "dashscope"                      # Or provider = "openrouter" with model = "google/gemini-3.5-flash-lite"
#   model = "qwen3.8-omni-flash"
#   effort = "auto"
